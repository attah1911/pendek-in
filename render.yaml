# Render Blueprint — deploys the API from server/.
# Create it via  New > Blueprint  (NOT "New > Web Service", which ignores this file).
# Then fill in the secret env vars (sync:false) under the service's Environment tab.
services:
  - type: web
    name: shrtn-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install && npm run build && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # client and API live on different domains (vercel.app vs onrender.com)
      - key: COOKIE_SAMESITE
        value: none
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: BCRYPT_ROUNDS
        value: "12"
      # Supabase transaction pooler: port 6543, ?pgbouncer=true
      - key: DATABASE_URL
        sync: false
      # Supabase session pooler: port 5432 (used by prisma migrate)
      - key: DIRECT_URL
        sync: false
      # Upstash rediss:// URL
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: IP_HASH_SALT
        sync: false
      # the Vercel URL, e.g. https://shrtn.vercel.app
      - key: CLIENT_ORIGIN
        sync: false
