# Render Blueprint — deploys the API from server/.
# In the Render dashboard: New > Blueprint, pick this repo. Then fill in the
# secret env vars (marked sync:false) under the service's Environment tab.
services:
  - type: web
    name: shrtn-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install && npm run build && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: COOKIE_SAMESITE
        value: none # client and API are on different domains (vercel.app vs onrender.com)
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: BCRYPT_ROUNDS
        value: "12"
      - key: DATABASE_URL # Supabase transaction pooler (port 6543, ?pgbouncer=true)
        sync: false
      - key: DIRECT_URL # Supabase session pooler (port 5432) — used by prisma migrate
        sync: false
      - key: REDIS_URL # Upstash rediss:// URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: IP_HASH_SALT
        sync: false
      - key: CLIENT_ORIGIN # the Vercel URL, e.g. https://shrtn.vercel.app
        sync: false
